<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="596" viewBox="0 0 680 596" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Схема подключения CH375B к ESP32-C6 по параллельной шине</title>
<desc>ESP32-C6 соединён с CH375B 12 проводами: восемь линий данных D0-D7, RD#, WR#, A0 и INT#. CS# и TXD подтянуты к земле. CH375B подключён по USB к принтеру.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:bold}
.ts{font-size:12px}
.teal-t{fill:#085041}
.purple-t{fill:#3C3489}
.gray-t{fill:#444441}
.note{fill:#444441}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="596" fill="#FFFFFF"/>

<rect x="40" y="40" width="160" height="374" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th teal-t" x="120" y="62" text-anchor="middle" dominant-baseline="central">ESP32-C6</text>
<text class="ts teal-t" x="120" y="80" text-anchor="middle" dominant-baseline="central">Super Mini</text>
<g class="ts teal-t" text-anchor="end" dominant-baseline="central">
<text x="188" y="108">GPIO18</text>
<text x="188" y="134">GPIO19</text>
<text x="188" y="160">GPIO7</text>
<text x="188" y="186">GPIO6</text>
<text x="188" y="212">GPIO3</text>
<text x="188" y="238">GPIO2</text>
<text x="188" y="264">GPIO1</text>
<text x="188" y="290">GPIO0</text>
<text x="188" y="316">GPIO23</text>
<text x="188" y="342">GPIO22</text>
<text x="188" y="368">GPIO21</text>
<text x="188" y="394">GPIO20</text>
</g>

<rect x="440" y="40" width="160" height="430" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th purple-t" x="520" y="62" text-anchor="middle" dominant-baseline="central">CH375B</text>
<text class="ts purple-t" x="520" y="80" text-anchor="middle" dominant-baseline="central">Parallel mode</text>
<g class="ts purple-t" dominant-baseline="central">
<text x="452" y="108">D0</text>
<text x="452" y="134">D1</text>
<text x="452" y="160">D2</text>
<text x="452" y="186">D3</text>
<text x="452" y="212">D4</text>
<text x="452" y="238">D5</text>
<text x="452" y="264">D6</text>
<text x="452" y="290">D7</text>
<text x="452" y="316">RD#</text>
<text x="452" y="342">WR#</text>
<text x="452" y="368">A0</text>
<text x="452" y="394">INT#</text>
<text x="452" y="420">CS#</text>
<text x="452" y="446">TXD</text>
</g>

<g stroke="#888780" stroke-width="1" fill="none">
<line x1="200" y1="108" x2="440" y2="108"/>
<line x1="200" y1="134" x2="440" y2="134"/>
<line x1="200" y1="160" x2="440" y2="160"/>
<line x1="200" y1="186" x2="440" y2="186"/>
<line x1="200" y1="212" x2="440" y2="212"/>
<line x1="200" y1="238" x2="440" y2="238"/>
<line x1="200" y1="264" x2="440" y2="264"/>
<line x1="200" y1="290" x2="440" y2="290"/>
<line x1="200" y1="316" x2="438" y2="316" marker-end="url(#arrow)"/>
<line x1="200" y1="342" x2="438" y2="342" marker-end="url(#arrow)"/>
<line x1="200" y1="368" x2="438" y2="368" marker-end="url(#arrow)"/>
<line x1="440" y1="394" x2="202" y2="394" marker-end="url(#arrow)"/>
<line x1="440" y1="420" x2="372" y2="420"/>
<line x1="440" y1="446" x2="412" y2="446"/>
<line x1="342" y1="446" x2="314" y2="446"/>
</g>

<rect x="302" y="408" width="70" height="24" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts gray-t" x="337" y="420" text-anchor="middle" dominant-baseline="central">GND</text>
<rect x="342" y="434" width="70" height="24" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts gray-t" x="377" y="446" text-anchor="middle" dominant-baseline="central">1 kΩ</text>
<rect x="244" y="434" width="70" height="24" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text class="ts gray-t" x="279" y="446" text-anchor="middle" dominant-baseline="central">GND</text>

<text class="ts note" x="40" y="436">CS# и TXD подтянуты вниз:</text>
<text class="ts note" x="40" y="454">всегда выбран, параллельный режим</text>

<line x1="520" y1="470" x2="520" y2="498" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#arrow)"/>

<rect x="440" y="500" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th gray-t" x="520" y="518" text-anchor="middle" dominant-baseline="central">HP LaserJet P2015</text>
<text class="ts gray-t" x="520" y="538" text-anchor="middle" dominant-baseline="central">USB, линии D+ и D-</text>
</svg>
